name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    name: Cairo & Snap Watchtower Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.18.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Cairo formatting
        run: scarb fmt --check
      - name: Compile Sierra & CASM artifacts
        run: scarb build
      - name: Test RLNv2 F_P Watchtower & URI Codec
        run: node --experimental-strip-types snap/src/rln.test.ts
