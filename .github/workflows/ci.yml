name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    name: Build & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.18.0"
      - name: Check Cairo formatting
        run: scarb fmt --check
      - name: Compile Sierra & CASM artifacts
        run: scarb build
